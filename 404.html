<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Alirza Jafarov</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#e8e4df;--text2:#8a8580;--text3:#5a5550;--green:#033f26;--green-l:#4da87a;--cream:#ebebd9;--border:#1e1e1e;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
body::after{content:'';position:fixed;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;pointer-events:none;z-index:10000}
.code{font-family:var(--serif);font-size:clamp(6rem,15vw,10rem);font-weight:300;color:var(--green-l);line-height:1;margin-bottom:1rem;opacity:.3}
h1{font-family:var(--serif);font-size:1.8rem;font-weight:300;margin-bottom:1rem;font-style:italic;color:var(--cream)}
p{color:var(--text2);font-size:.95rem;margin-bottom:2.5rem;max-width:400px;line-height:1.7}
.links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.links a{padding:.7rem 1.4rem;border:1px solid var(--border);color:var(--text2);text-decoration:none;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;transition:all .3s}
.links a:hover{border-color:var(--green-l);color:var(--cream);background:rgba(3,63,38,.08)}
.links a.primary{background:var(--green);border-color:var(--green-l);color:var(--cream)}
.links a.primary:hover{background:var(--green-l);color:var(--bg)}
</style>
</head>
<body>
<div class="code">404</div>
<h1>Nothing here but silence.</h1>
<p>The page you're looking for doesn't exist, or it was moved. Maybe the URL is wrong, or maybe this story hasn't been written yet.</p>
<div class="links">
  <a href="/" class="primary">Home</a>
  <a href="/journal/">Journal</a>
</div>
</body>
</html>
