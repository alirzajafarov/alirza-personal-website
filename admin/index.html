<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — alirza.com</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#181818;--bg4:#1e1e1e;--text:#e8e4df;--text2:#8a8580;--text3:#5a5550;--green:#033f26;--green-d:#065a38;--green-l:#4da87a;--cream:#ebebd9;--border:#222;--red:#e24b4a;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;min-height:100vh}
::selection{background:var(--cream);color:var(--bg)}
input,select,textarea,button{font-family:inherit}

/* ─── LOGIN ─── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{width:100%;max-width:340px;padding:2.5rem;border:1px solid var(--border);background:var(--bg2);border-radius:8px}
.login-logo{text-align:center;margin-bottom:2rem}
.login-logo img{height:56px;width:56px;border-radius:50%}
.login-box h2{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--green-l);margin-bottom:1.5rem;text-align:center;font-weight:400}
.login-box input{width:100%;padding:.75rem 1rem;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:.85rem;margin-bottom:.75rem;outline:none;transition:border-color .3s;border-radius:4px}
.login-box input:focus{border-color:var(--green-l)}
.login-box input::placeholder{color:var(--text3)}
.login-btn{width:100%;padding:.75rem;background:var(--green);border:1px solid var(--green-d);color:var(--cream);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .3s;border-radius:4px;margin-top:.5rem}
.login-btn:hover{background:var(--green-l);color:var(--bg)}
.login-error{color:var(--red);font-size:.8rem;margin-bottom:.75rem;text-align:center;display:none}

/* ─── DASHBOARD ─── */
.dashboard{display:none;min-height:100vh;display:none}
.dash-header{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:10}
.dash-left{display:flex;align-items:center;gap:1rem}
.dash-logo{height:22px;width:22px;border-radius:50%}
.dash-title{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3)}
.dash-right{display:flex;align-items:center;gap:.75rem}
.dash-user{font-size:.75rem;color:var(--text2)}
.btn{padding:.35rem .75rem;background:none;border:1px solid var(--border);color:var(--text2);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .3s;border-radius:3px}
.btn:hover{border-color:var(--green-d);color:var(--cream)}
.btn-primary{background:var(--green);border-color:var(--green-d);color:var(--cream)}
.btn-primary:hover{background:var(--green-l);color:var(--bg)}
.btn-danger{border-color:#3a1515;color:var(--red)}
.btn-danger:hover{background:#3a1515;color:#fff}
.btn-icon{display:inline-flex;align-items:center;gap:.3rem}

/* ─── POSTS LIST ─── */
.posts-view{padding:1.5rem}
.posts-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.posts-top h2{font-size:1rem;font-weight:400}
.posts-stats{display:flex;gap:1.5rem;margin-bottom:1.5rem}
.stat-card{padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:6px;flex:1;text-align:center}
.stat-card .num{font-size:1.5rem;color:var(--cream);font-weight:300}
.stat-card .lbl{font-size:.6rem;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;margin-top:.2rem}
.posts-filters{display:flex;gap:.5rem;margin-bottom:1rem}
.filter-btn{padding:.3rem .7rem;border:1px solid var(--border);background:none;color:var(--text3);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s}
.filter-btn.active{border-color:var(--green-d);color:var(--green-l);background:rgba(3,63,38,.1)}
.filter-btn:hover{border-color:var(--green-d);color:var(--text2)}
.posts-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.post-row{display:grid;grid-template-columns:1fr 40px 90px 80px 60px;gap:.75rem;padding:.75rem 1rem;background:var(--bg2);align-items:center;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.post-row:last-child{border-bottom:none}
.post-row:hover{background:var(--bg3)}
.pr-title{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-lang{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .35rem;border-radius:2px;text-align:center;font-weight:500}
.pr-lang.en{color:var(--text3);border:1px solid var(--border)}
.pr-lang.az{color:var(--green-l);border:1px solid var(--green-d)}
.pr-date{font-size:.7rem;color:var(--text3)}
.pr-status{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .5rem;border-radius:2px;text-align:center}
.pr-status.published{color:var(--green-l);background:rgba(3,63,38,.15)}
.pr-status.draft{color:var(--text3);background:var(--bg3)}
.pr-edit{font-size:.6rem;color:var(--text3);text-align:right;cursor:pointer;transition:color .2s}
.pr-edit:hover{color:var(--cream)}
.empty-state{text-align:center;padding:3rem;color:var(--text3);font-size:.85rem}

/* ─── EDITOR ─── */
.editor-view{display:none;height:calc(100vh - 45px);flex-direction:column}
.ed-top{display:flex;gap:.5rem;padding:.6rem 1rem;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;align-items:center}
.ed-top input,.ed-top select{padding:.4rem .7rem;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:.8rem;outline:none;border-radius:3px;transition:border-color .2s}
.ed-top input:focus,.ed-top select:focus{border-color:var(--green-l)}
.ed-top .title-input{flex:2;min-width:180px;font-size:.9rem;font-weight:500}
.ed-top .sub-input{flex:2;min-width:150px}
.ed-top .tags-input{flex:1;min-width:100px}
.ed-top .date-input{width:120px}
.ed-top select{width:55px;font-size:.75rem}
.ed-actions{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-shrink:0}
.ed-status{font-size:.6rem;color:var(--text3);letter-spacing:.1em;margin-right:.5rem}

.md-toolbar{display:flex;gap:2px;padding:.35rem .75rem;border-bottom:1px solid var(--border);background:var(--bg2)}
.md-btn{padding:.3rem .5rem;background:none;border:1px solid transparent;color:var(--text3);font-size:.7rem;cursor:pointer;transition:all .2s;border-radius:2px;font-family:var(--mono);line-height:1}
.md-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border)}
.md-btn.active{color:var(--green-l);border-color:var(--green-d)}
.md-sep{width:1px;background:var(--border);margin:0 .3rem;align-self:stretch}

.ed-body{display:grid;grid-template-columns:1fr 1fr;flex:1;overflow:hidden}
.ed-body.preview-only{grid-template-columns:0 1fr}
.ed-body.edit-only{grid-template-columns:1fr 0}
.ed-pane{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.ed-pane-h{padding:.3rem .75rem;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center}
.ed-wordcount{font-variant-numeric:tabular-nums}
.ed-textarea{flex:1;padding:1.2rem;background:var(--bg);border:none;color:var(--text);font-family:var(--mono);font-size:.85rem;line-height:1.8;resize:none;outline:none;tab-size:2;overflow-y:auto}
.ed-textarea::placeholder{color:var(--text3)}
.preview-pane{overflow-y:auto;background:var(--bg)}
.preview-content{padding:1.5rem;font-family:var(--sans);font-size:.9rem;line-height:1.8;color:var(--text2);max-width:650px}
.preview-content h1,.preview-content h2,.preview-content h3{color:var(--text);font-weight:400;margin:1.5rem 0 .8rem}
.preview-content h2{font-size:1.3rem}
.preview-content h3{font-size:1.1rem}
.preview-content p{margin-bottom:1rem}
.preview-content strong{color:var(--text);font-weight:500}
.preview-content em{color:var(--cream)}
.preview-content blockquote{border-left:2px solid var(--green);padding:.5rem 0 .5rem 1rem;margin:1rem 0;font-style:italic}
.preview-content ul{margin:1rem 0;padding-left:1.5rem}
.preview-content li{margin-bottom:.4rem}
.preview-content a{color:var(--green-l)}
.preview-content hr{border:none;height:1px;background:var(--border);margin:1.5rem 0}
.preview-content img{max-width:100%;border:1px solid var(--border);margin:1rem 0;border-radius:4px}
.preview-content .pullquote{font-size:1.2rem;color:var(--cream);text-align:center;padding:1rem 0;margin:1.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;padding:.6rem 1.2rem;background:var(--green);color:var(--cream);font-size:.75rem;border:1px solid var(--green-d);transform:translateY(80px);opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);z-index:100;border-radius:4px}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:768px){
  .ed-body{grid-template-columns:1fr}
  .preview-pane{display:none}
  .ed-top{flex-direction:column}
  .ed-top input,.ed-top select{width:100%}
  .ed-actions{margin-left:0;width:100%;justify-content:space-between}
  .post-row{grid-template-columns:1fr 40px 80px}
  .pr-date,.pr-edit{display:none}
  .posts-stats{flex-direction:column;gap:.5rem}
  .md-toolbar{overflow-x:auto}
}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('blog_token');
let currentSlug = null;
let autoSaveTimer = null;
let postFilter = 'all';

// ─── AUTH ───
async function login() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username:user,password:pass})
    });
    const d = await r.json();
    if (d.token) {
      token = d.token;
      localStorage.setItem('blog_token', token);
      showDashboard(d.username);
    } else {
      const err = document.getElementById('loginError');
      err.textContent = d.error || 'Invalid credentials';
      err.style.display = 'block';
    }
  } catch(e) {
    const err = document.getElementById('loginError');
    err.textContent = 'Cannot reach server';
    err.style.display = 'block';
  }
}

async function logout() {
  await fetch(API+'/api/logout',{method:'POST',headers:authH()}).catch(()=>{});
  token=null; localStorage.removeItem('blog_token');
  document.getElementById('loginView').style.display='flex';
  document.getElementById('dashboard').style.display='none';
}

function authH(){return{'Content-Type':'application/json','Authorization':'Bearer '+token}}

async function checkAuth(){
  if(!token)return;
  try{const r=await fetch(API+'/api/me',{headers:authH()});const d=await r.json();if(d.username)showDashboard(d.username)}catch{}
}

function showDashboard(username){
  document.getElementById('loginView').style.display='none';
  document.getElementById('dashboard').style.display='block';
  document.getElementById('dashUsername').textContent=username;
  loadPosts();
}

// ─── POSTS ───
let allAdminPosts = [];

async function loadPosts(){
  const r=await fetch(API+'/api/admin/posts',{headers:authH()});
  const d=await r.json();
  allAdminPosts = d.posts || [];
  renderStats();
  renderFilters();
  renderPosts();
}

function renderStats(){
  const total=allAdminPosts.length;
  const pub=allAdminPosts.filter(p=>p.status==='published').length;
  const drafts=total-pub;
  const en=allAdminPosts.filter(p=>(p.lang||'en')==='en').length;
  const az=allAdminPosts.filter(p=>p.lang==='az').length;
  document.getElementById('postsStats').innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="num">${pub}</div><div class="lbl">Published</div></div>
    <div class="stat-card"><div class="num">${drafts}</div><div class="lbl">Drafts</div></div>
    <div class="stat-card"><div class="num">${en} / ${az}</div><div class="lbl">EN / AZ</div></div>`;
}

function renderFilters(){
  document.getElementById('postsFilters').innerHTML=
    ['all','published','draft','en','az'].map(f=>
      `<button class="filter-btn ${postFilter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`
    ).join('');
}

function setFilter(f){postFilter=f;renderFilters();renderPosts()}

function renderPosts(){
  let posts=allAdminPosts;
  if(postFilter==='published')posts=posts.filter(p=>p.status==='published');
  if(postFilter==='draft')posts=posts.filter(p=>p.status==='draft');
  if(postFilter==='en')posts=posts.filter(p=>(p.lang||'en')==='en');
  if(postFilter==='az')posts=posts.filter(p=>p.lang==='az');

  const list=document.getElementById('postsList');
  if(!posts.length){list.innerHTML='<div class="empty-state">No posts match this filter.</div>';return}
  list.innerHTML=posts.map(p=>{
    const safeSlug=String(p.slug||'').replace(/[^a-z0-9-]/gi,'');
    const safeLang=String(p.lang||'en').replace(/[^a-z]/gi,'').slice(0,2)||'en';
    const safeStatus=String(p.status||'').replace(/[^a-z]/gi,'');
    return `
    <div class="post-row" onclick="editPost('${safeSlug}')">
      <div class="pr-title">${esc(p.title)}</div>
      <div class="pr-lang ${safeLang}">${safeLang.toUpperCase()}</div>
      <div class="pr-date">${esc(p.date)}</div>
      <div class="pr-status ${safeStatus}">${esc(safeStatus)}</div>
      <div class="pr-edit">Edit →</div>
    </div>`;
  }).join('');
}

function newPost(){
  currentSlug=null;
  document.getElementById('edTitle').value='';
  document.getElementById('edSubtitle').value='';
  document.getElementById('edCoverImage').value='';
  document.getElementById('edTags').value='';
  document.getElementById('edDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('edContent').value='';
  document.getElementById('edLang').value='en';
  document.getElementById('previewContent').innerHTML='';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('edStatus').textContent='New post';
  updateWordCount();
  showEditor();
}

async function editPost(slug){
  const r=await fetch(API+'/api/admin/posts/'+slug,{headers:authH()});
  const d=await r.json();const p=d.post;
  currentSlug=p.slug;
  document.getElementById('edTitle').value=p.title;
  document.getElementById('edSubtitle').value=p.subtitle||'';
  document.getElementById('edCoverImage').value=p.coverImage||'';
  document.getElementById('edTags').value=(p.tags||[]).join(', ');
  document.getElementById('edDate').value=p.date;
  document.getElementById('edContent').value=p.content;
  document.getElementById('edLang').value=p.lang||'en';
  document.getElementById('deleteBtn').style.display='inline-flex';
  document.getElementById('edStatus').textContent=p.status==='published'?'Published':'Draft';
  updatePreview();updateWordCount();showEditor();
}

async function savePost(status){
  const body={
    slug:currentSlug,
    title:document.getElementById('edTitle').value,
    subtitle:document.getElementById('edSubtitle').value,
    coverImage:document.getElementById('edCoverImage').value,
    tags:document.getElementById('edTags').value,
    date:document.getElementById('edDate').value,
    content:document.getElementById('edContent').value,
    lang:document.getElementById('edLang').value,
    status
  };
  if(!body.title){toast('Title is required');return}
  const r=await fetch(API+'/api/admin/posts',{method:'POST',headers:authH(),body:JSON.stringify(body)});
  const d=await r.json();
  currentSlug=d.post.slug;
  document.getElementById('edStatus').textContent=status==='published'?'Published':'Draft saved';
  toast(d.message||'Saved!');
}

async function deletePost(){
  if(!currentSlug||!confirm('Delete this post permanently?'))return;
  await fetch(API+'/api/admin/posts/'+currentSlug,{method:'DELETE',headers:authH()});
  toast('Post deleted');backToList();
}

// ─── EDITOR UI ───
function showEditor(){
  document.getElementById('postsView').style.display='none';
  document.getElementById('editorView').style.display='flex';
}

function backToList(){
  document.getElementById('editorView').style.display='none';
  document.getElementById('postsView').style.display='block';
  loadPosts();
}

// Markdown toolbar
function mdInsert(before,after){
  const ta=document.getElementById('edContent');
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.selectionStart=ta.selectionEnd=s+before.length+sel.length;
  ta.focus();updatePreview();updateWordCount();
}

function mdWrap(before,after){
  const ta=document.getElementById('edContent');
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e)||'text';
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.selectionStart=s+before.length;
  ta.selectionEnd=s+before.length+sel.length;
  ta.focus();updatePreview();updateWordCount();
}

function toggleView(){
  const body=document.getElementById('edBody');
  const btn=document.getElementById('togglePreview');
  if(body.classList.contains('preview-only')){
    body.classList.remove('preview-only');
    btn.textContent='Preview';btn.classList.remove('active');
  }else if(body.classList.contains('edit-only')){
    body.classList.remove('edit-only');
    btn.textContent='Preview';btn.classList.remove('active');
  }else{
    body.classList.add('preview-only');
    btn.textContent='Edit';btn.classList.add('active');
  }
}

// Word count
function updateWordCount(){
  const text=document.getElementById('edContent').value;
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  const mins=Math.max(1,Math.ceil(words/200));
  document.getElementById('wordCount').textContent=`${words} words · ${mins} min read`;
}

// Auto-save draft every 30s
function startAutoSave(){
  clearInterval(autoSaveTimer);
  autoSaveTimer=setInterval(()=>{
    if(document.getElementById('edContent').value&&document.getElementById('edTitle').value){
      savePost('draft');
      document.getElementById('edStatus').textContent='Auto-saved';
    }
  },30000);
}

// Live preview
function updatePreview(){
  const md=document.getElementById('edContent').value;
  document.getElementById('previewContent').innerHTML=renderMarkdown(md);
}

function renderMarkdown(md){
    let h=esc(md)
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---$/gm,'<hr>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u)=>{const s=/^(https?:\/\/|\/|mailto:|#)/i.test(u)?u:'#';return '<a href="'+s+'" target="_blank" rel="noopener noreferrer">'+t+'</a>';})
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,a,u)=>{const s=/^(https?:\/\/|\/)/i.test(u)?u:'';return '<img src="'+s+'" alt="'+a+'">';})
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/^&gt;&gt;&gt; (.+) &lt;&lt;&lt;$/gm,'<div class="pullquote">$1</div>');
  h=h.replace(/((?:<li>.+<\/li>\n?)+)/g,'<ul>$1</ul>');
  h=h.replace(/<\/blockquote>\n<blockquote>/g,'<br>');
  return h.split('\n\n').map(b=>{
    b=b.trim();if(!b)return'';
    if(/^<[huo0-9ldbi]|^<hr|^<div|^<img|^<block/.test(b))return b;
    return`<p>${b}</p>`;
  }).join('\n');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// Event listeners
const edContent=document.getElementById('edContent');
edContent.addEventListener('input',()=>{updatePreview();updateWordCount()});
edContent.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();mdInsert('  ','');}
  if(e.key==='s'&&(e.ctrlKey||e.metaKey)){e.preventDefault();savePost('draft');} // Ctrl+S saves draft
  if(e.key==='Enter'&&e.shiftKey&&(e.ctrlKey||e.metaKey)){e.preventDefault();savePost('published');} // Ctrl+Shift+Enter publishes
});

document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('loginUser').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPass').focus()});

// Fix logo images with base64 after load
(async function fixLogos(){
  try {
    // Try to load logo, if fails use text fallback
    const imgs = document.querySelectorAll('#loginLogoImg, #dashLogoImg');
    imgs.forEach(img => {
      img.onerror = () => { img.style.display='none'; };
    });
  } catch(e) {}
})();

checkAuth();
</script>
